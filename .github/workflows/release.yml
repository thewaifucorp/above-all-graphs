name: release

# Tag a version (v0.1.0) to build prebuilt binaries for every supported
# platform and attach them to a GitHub Release — the npm wrapper's
# postinstall downloads from here, so end users never compile anything
# (SPEC.md section 0).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0) — must already exist"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Both mac targets build on the Apple Silicon runner: rustc/clang
          # cross-compile x86_64-apple-darwin fine from an arm64 host, and
          # it avoids depending on macos-13's Intel runner capacity, which
          # GitHub has been queuing for 30+ min (deprecated pool).
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf aag-${{ matrix.target }}.tar.gz aag
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path aag.exe -DestinationPath aag-${{ matrix.target }}.zip

      # The semantic build is the same binary plus embeddings. `ort` links
      # onnxruntime statically, so the artifact stays a single self-contained
      # file — no sidecar library, nothing for a user to install. It ships as
      # a separate asset because it is ~4x the size and most users never
      # enable it (`AAG_SEMANTIC=1 npm i -g @waifucorp/aag` opts in).
      # `ort` ships no prebuilt onnxruntime for Intel macOS, and building it
      # from source here would trade a 5-minute job for a 40-minute one to
      # serve a shrinking platform. That target gets the plain binary only;
      # every other target still gets both. Skipping deliberately beats a red
      # release that blocks the assets already built.
      - name: Build with semantic search
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo build --release --features semantic --target ${{ matrix.target }}
      - name: Package semantic (unix)
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf aag-semantic-${{ matrix.target }}.tar.gz aag
      - name: Package semantic (windows)
        if: runner.os == 'Windows' && matrix.target != 'x86_64-apple-darwin'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path aag.exe -DestinationPath aag-semantic-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: aag-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/aag-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/aag-${{ matrix.target }}.zip
            target/${{ matrix.target }}/release/aag-semantic-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/aag-semantic-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file for every asset, so a download can be verified
      # without trusting the transport or the mirror it came through.
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The npm wrapper's postinstall downloads `v<package.json version>`, so
      # publishing a package whose version has no matching release would give
      # every installer a 404. Fail here instead.
      - name: Package version matches the tag
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          npm_version="v$(node -p "require('./npm/package.json').version")"
          crate_version="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag npm=$npm_version crate=$crate_version"
          test "$tag" = "$npm_version" || { echo "npm/package.json is $npm_version, tag is $tag"; exit 1; }
          test "$tag" = "$crate_version" || { echo "Cargo.toml is $crate_version, tag is $tag"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publishing is a separate job so a failed npm publish never blocks the
  # GitHub release the binaries are already attached to. It is skipped
  # entirely when no token is configured, which keeps forks green.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Installer tests
        run: node --test "npm/*.test.js"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping publish"
            exit 0
          fi
          cd npm && npm publish --access public --provenance
